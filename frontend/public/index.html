<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraków Tram Simulator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div id="map"></div>

<div id="simulation-controls" class="control-panel">
    <select id="service-selector" class="service-selector">
        <option value="service_1">Mon-Tue-Wed</option>
        <option value="service_5">Thursday</option>
        <option value="service_4">Friday</option>
        <option value="service_2">Saturday</option>
        <option value="service_3">Sunday</option>
    </select>
    <div class="slider-container">
        <div class="slider-label">
            <span>Time:</span>
            <span id="simulation-time" class="time-display">--:--</span>
        </div>
        <input type="range" id="time-slider" class="time-slider" min="0" max="1440" value="0" step="1">
    </div>
    <div class="slider-container">
        <label for="speed-slider" class="slider-label">Speed: <span id="speed-display">1.0x</span></label>
        <input type="range" id="speed-slider" class="speed-slider" min="-1" max="1" value="0" step="0.01"
               title="1 real second = 1 simulation minute">
    </div>
    <button id="btn-pause" class="btn btn-secondary" title="Pause Simulation">
        <i class="fas fa-pause"></i>
    </button>
    <button id="btn-restart" class="btn btn-secondary" title="Restart Simulation">
        <i class="fas fa-redo"></i>
    </button>
    <button id="btn-stats" class="btn btn-secondary" title="View Statistics">
        <i class="fas fa-chart-bar"></i>
    </button>
</div>

<div class="right-controls">
    <!-- Simulation Configuration -->
    <div id="config-panel" class="control-panel-item">
        <button id="config-toggle" class="settings-toggle-btn" title="Simulation Configuration">
            <i class="fas fa-sliders-h" style="font-size: 20px;"></i>
        </button>
        <div id="config-content" class="settings-content config-content-right">
            <h3 class="settings-title">Simulation Config</h3>
            <div class="settings-item">
                <button id="btn-config-demand" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-users"></i> Passenger Demand
                </button>
            </div>
            <div class="settings-item">
                <button id="btn-config-weights" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-balance-scale"></i> Stop Weights
                </button>
            </div>
        </div>
    </div>

    <!-- Map Settings -->
    <div id="settings-panel" class="control-panel-item">
        <button id="settings-toggle" class="settings-toggle-btn" title="Map Settings">
            <i class="fas fa-layer-group" style="font-size: 20px;"></i>
        </button>
        <div id="settings-content" class="settings-content">
            <h3 class="settings-title">Map Settings</h3>
            <div class="settings-item">
                <label class="toggle-label">
                    <span class="toggle-text">Toggle Tram Stops</span>
                    <input type="checkbox" id="toggle-stops" class="toggle-input" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<div id="loading-overlay" class="overlay hidden">
    <div class="overlay-content">
        <div class="tram-spinner">
            <i class="fas fa-subway fa-2x"></i>
        </div>
        <div class="loading-text">Loading simulation data...</div>
    </div>
</div>

<div id="connection-error-overlay" class="overlay hidden">
    <div class="overlay-content error-content">
        <i class="fas fa-wifi-slash fa-3x error-icon"></i>
        <h2>Connection Lost</h2>
        <p>Unable to connect to the simulation server. Make sure that the server is running and try again.</p>
    </div>
</div>

<div id="statistics-overlay" class="overlay hidden">
    <div class="overlay-content stats-content">
        <div class="stats-header">
            <h2>Simulation Statistics</h2>
        </div>
        <div class="stats-summary">
            <div class="stat-card">
                <h3>Total Boarded</h3>
                <div id="stat-total-boarded" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Alighted</h3>
                <div id="stat-total-alighted" class="stat-value">0</div>
            </div>
        </div>
        <div class="stats-chart-container">
            <canvas id="passenger-chart"></canvas>
        </div>
        <div class="detailed-stats-container">
             <h3 style="margin-top: 0;">Top Busy Stops</h3>
             <table id="top-stops-table" style="width: 100%; text-align: left; border-collapse: collapse;">
                 <thead>
                     <tr style="border-bottom: 2px solid #eee;">
                         <th style="padding: 8px;">Stop Name</th>
                         <th style="padding: 8px;">Boarded</th>
                         <th style="padding: 8px;">Alighted</th>
                     </tr>
                 </thead>
                 <tbody>
                 </tbody>
             </table>
        </div>
        <div style="margin-top: 20px;">
            <button id="close-stats-btn" class="btn btn-primary">Close Statistics</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>

</html>
